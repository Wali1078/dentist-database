<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دریا – مدیریت کلینیک دندانپزشکی</title>
  <link rel="stylesheet" href="/static/css/theme.css">
  <link rel="stylesheet" href="/static/css/layout.css">
</head>
<body>

<div id="app">
  <!-- ── Sidebar ── -->
  <nav id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2C8 2 5 5.5 5 8c0 2 .8 3.5 2 5l1 5h8l1-5c1.2-1.5 2-3 2-5 0-2.5-3-6-7-6z"/>
        </svg>
      </div>
      <span class="brand-name">دریا</span>
    </div>

    <div class="sidebar-nav">
      <div class="nav-link active" data-page="dashboard">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        <span class="nav-label">داشبورد</span>
      </div>
      <div class="nav-link" data-page="patients">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span class="nav-label">بیماران</span>
      </div>
      <div class="nav-link" data-page="appointments">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span class="nav-label">نوبت‌ها</span>
      </div>
      <div class="nav-link" data-page="dental">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C8 2 5 5.5 5 8c0 2 .8 3.5 2 5l1 5h8l1-5c1.2-1.5 2-3 2-5 0-2.5-3-6-7-6z"/></svg>
        <span class="nav-label">سابقه دندان</span>
      </div>
      <div class="nav-link" data-page="billing">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
        <span class="nav-label">صورت‌حساب</span>
      </div>
      <div class="nav-link" data-page="inventory">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
        <span class="nav-label">انبار</span>
      </div>
      <div class="nav-link" data-page="staff">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span class="nav-label">کارمندان</span>
      </div>
      <div class="nav-link" data-page="expenses">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        <span class="nav-label">مصارف</span>
      </div>
      <div class="nav-link" data-page="reports">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        <span class="nav-label">گزارشات</span>
      </div>
    </div>

    <div class="sidebar-footer">دریا v1.0</div>
  </nav>

  <!-- ── Main ── -->
  <div id="main">
    <header id="header">
      <button id="menu-btn" onclick="toggleSidebar()" title="منو">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <h1 id="page-title">داشبورد</h1>
    </header>

    <main id="content">
      <!-- pages injected here by JS -->
      <div id="page-dashboard"></div>
      <div id="page-patients"    class="hidden"></div>
      <div id="page-appointments" class="hidden"></div>
      <div id="page-dental"      class="hidden"></div>
      <div id="page-billing"     class="hidden"></div>
      <div id="page-inventory"   class="hidden"></div>
      <div id="page-staff"       class="hidden"></div>
      <div id="page-expenses"    class="hidden"></div>
      <div id="page-reports"     class="hidden"></div>
    </main>
  </div>
</div>

<!-- Toast container -->
<div class="toast-container" id="toast-container"></div>

<style>
  .hidden { display: none !important; }
</style>

<script src="/static/js/api.js"></script>
<script src="/static/js/utils.js"></script>
<script src="/static/js/dashboard.js"></script>
<script src="/static/js/patients.js"></script>
<script src="/static/js/appointments.js"></script>
<script src="/static/js/dental.js"></script>
<script src="/static/js/billing.js"></script>
<script src="/static/js/inventory.js"></script>
<script src="/static/js/staff.js"></script>
<script src="/static/js/expenses.js"></script>
<script src="/static/js/reports.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
